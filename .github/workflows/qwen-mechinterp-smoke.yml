name: Qwen mech-interp smoke tests

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Hugging Face model id to test
        required: false
        default: hf-internal-testing/tiny-random-LlamaForCausalLM
      tests:
        description: Comma-separated tests or all
        required: false
        default: all
  push:
    paths:
      - scripts/mechinterp_smoke_tests.py
      - requirements-mechinterp.txt
      - .github/workflows/qwen-mechinterp-smoke.yml
  pull_request:
    paths:
      - scripts/mechinterp_smoke_tests.py
      - requirements-mechinterp.txt
      - .github/workflows/qwen-mechinterp-smoke.yml

jobs:
  mechinterp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
        test-suite:
          - all

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-mechinterp.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mechinterp.txt

      - name: Run mech-interp smoke tests
        env:
          MODEL_ID: ${{ github.event.inputs.model_id || 'hf-internal-testing/tiny-random-LlamaForCausalLM' }}
          TESTS: ${{ github.event.inputs.tests || matrix.test-suite }}
        run: |
          python scripts/mechinterp_smoke_tests.py \
            --model-id "$MODEL_ID" \
            --tests "$TESTS" \
            --report mechinterp_report.json

      - name: Print report
        if: always()
        run: |
          if [ -f mechinterp_report.json ]; then
            cat mechinterp_report.json
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mechinterp-report
          path: mechinterp_report.json
          if-no-files-found: warn
